<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <!-- ===================================================
       BÖLÜM 1: iPhone / PWA AYARLARI
       Ana ekrana eklenince tam ekran açılması için gereken etiketler
       =================================================== -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Durum çubuğu (saat, pil) düz renkte dursun; içerik altına girip bulanıklaşmasın (Sürüm 0.4.2) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- Ana ekranda simgenin altında görünecek isim -->
  <meta name="apple-mobile-web-app-title" content="Yakıt">
  <!-- Durum çubuğunun rengi: başlık çubuğuyla aynı (açık / koyu tema) -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161b26" media="(prefers-color-scheme: dark)">
  <title>Yakıt Takip</title>
  <!-- Ana ekran simgesi (Sürüm 1.0) -->
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <!-- ===================================================
       BÖLÜM 2: STİLLER (GÖRÜNÜM)
       =================================================== -->
  <style>
    /* --- Renkler: açık tema --- */
    :root {
      --arkaplan: #f3f4f6;
      --kart: #ffffff;
      --yazi: #111827;
      --soluk: #6b7280;
      --cizgi: #e5e7eb;
      --lpg: #2563eb;      /* LPG için mavi */
      --benzin: #ea580c;   /* Benzin için turuncu */
      --dizel: #7c3aed;    /* Dizel için mor (Sürüm 1.4) */
      --vurgu: #059669;    /* Genel vurgu (yeşil) */
      /* Grafik renkleri (Sürüm 1.5): renk körlüğü testinden geçirildi; koyu temada ayrı tonlar */
      --g-lpg: #2563eb;
      --g-benzin: #ea580c;
      --g-dizel: #7c3aed;
    }

    /* --- Renkler: telefon karanlık moddaysa koyu tema --- */
    @media (prefers-color-scheme: dark) {
      :root {
        --arkaplan: #0b0f17;
        --kart: #161b26;
        --yazi: #f3f4f6;
        --soluk: #9ca3af;
        --cizgi: #263041;
        --lpg: #60a5fa;
        --benzin: #fb923c;
        --dizel: #a78bfa;
        --vurgu: #34d399;
        --g-lpg: #3b82f6;
        --g-benzin: #dd5f12;
        --g-dizel: #8b5cf6;
        --buton-yazi: #052e22;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--arkaplan);
      color: var(--yazi);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent; /* dokununca gri parlama olmasın */
    }

    /* Üst başlık: çentik (notch) altında kalmasın diye safe-area boşluğu */
    header {
      /* Üstte geniş boşluk: iOS 26 durum çubuğunun hemen altını bulanıklaştırıyor,
         başlık o şeridin dışında kalsın (Sürüm 0.4.3) */
      padding: calc(env(safe-area-inset-top) + 34px) 16px 12px;
      background: var(--kart);
      border-bottom: 1px solid var(--cizgi);
    }
    header h1 { font-size: 20px; -webkit-font-smoothing: antialiased; }
    header small { color: var(--soluk); font-size: 12px; }

    /* Sayfa içeriği: alttaki sekme çubuğunun arkasında kalmasın */
    main {
      padding: 16px 16px calc(env(safe-area-inset-bottom) + 160px);  /* + düğmesi son satırı kapatmasın */
    }

    /* Sekmelerden sadece aktif olan görünür */
    .sayfa { display: none; }
    .sayfa.aktif { display: block; }

    .kart {
      background: var(--kart);
      border: 1px solid var(--cizgi);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .kart h2 { font-size: 15px; color: var(--soluk); font-weight: 500; margin-bottom: 6px; }
    .kart .deger { font-size: 28px; font-weight: 700; }
    .lpg-renk { color: var(--lpg); }
    .benzin-renk { color: var(--benzin); }
    .dizel-renk { color: var(--dizel); }
    .vurgu-renk { color: var(--vurgu); }
    .bilgi { color: var(--soluk); font-size: 14px; line-height: 1.5; }

    /* Alt sekme çubuğu (iPhone ana ekran çizgisinin üstünde dursun) */
    nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      display: flex;
      background: var(--kart);
      border-top: 1px solid var(--cizgi);
      /* iPhone ev çizgisi için boşluk: tamamı değil, yarısı kadar (butonlar aşağıda dursun) */
      padding-bottom: calc(env(safe-area-inset-bottom) * 0.5);
    }
    nav button {
      flex: 1;
      background: none;
      border: none;
      padding: 8px 0 6px;
      color: var(--soluk);
      font-size: 12px;
      font-family: inherit;
    }
    nav button .ikon { display: block; font-size: 22px; margin-bottom: 2px; }
    nav button.aktif { color: var(--vurgu); font-weight: 600; }

    /* ---------- KAYIT FORMU (Adım 3) ---------- */
    .alan { margin-bottom: 14px; }
    .alan label { display: block; font-size: 13px; color: var(--soluk); margin-bottom: 6px; }
    .alan input {
      width: 100%;
      min-height: 46px;
      font-size: 16px;            /* 16px'ten küçük olursa iPhone kutuya yakınlaştırır */
      padding: 12px;
      border: 1px solid var(--cizgi);
      border-radius: 10px;
      background: var(--arkaplan);
      color: var(--yazi);
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
    }
    .alan input::-webkit-date-and-time-value { text-align: left; }
    .alan input:focus { outline: 2px solid var(--vurgu); border-color: transparent; }

    /* İki kutuyu yan yana koymak için (Tarih-Saat, Litre-Tutar) */
    .yan-yana { display: flex; gap: 10px; }
    .yan-yana .alan { flex: 1; min-width: 0; }

    /* Yakıt türü seçim düğmeleri (kayıt formu ve Yakıt ayarları kartı) */
    .secim {
      display: flex;
      background: var(--arkaplan);
      border: 1px solid var(--cizgi);
      border-radius: 10px;
      padding: 3px;
    }
    .secim input { display: none; }
    .secim label {
      flex: 1;
      text-align: center;
      padding: 9px 0;
      margin: 0;
      border-radius: 8px;
      font-size: 15px;
      color: var(--soluk);
    }
    .secim input:checked + label {
      background: var(--kart);
      color: var(--yazi);
      font-weight: 600;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .15);
    }
    /* Seçili yakıt kendi renginde yazılır (Sürüm 1.4: Dizel eklendi) */
    .secim input[value="LPG"]:checked + label { color: var(--lpg); }
    .secim input[value="BENZIN"]:checked + label { color: var(--benzin); }
    .secim input[value="DIZEL"]:checked + label { color: var(--dizel); }
    .secim [hidden] { display: none; }

    /* Kutuların altındaki küçük açıklama / hata yazıları */
    .ipucu { font-size: 13px; color: var(--soluk); margin-top: 6px; min-height: 18px; }
    .ipucu.hata { color: #dc2626; }

    .buton {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: var(--vurgu);
      color: var(--buton-yazi, #fff);
      font-family: inherit;
    }
    .buton:active { opacity: .8; }

    /* "Kaydedildi" gibi kısa süreli bildirim balonu */
    .bildirim {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) * 0.5 + 76px);
      transform: translateX(-50%);
      background: var(--yazi);
      color: var(--arkaplan);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
    }
    .bildirim.goster { opacity: 1; z-index: 30; }

    /* ---------- AÇILIR EKLEME PANELİ (Sürüm 0.3) ---------- */
    /* Arkadaki karartma */
    .perde {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
      z-index: 10;
    }
    .perde.acik { opacity: 1; pointer-events: auto; }

    /* Alttan kayarak açılan panel */
    .panel {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      max-height: calc(100% - env(safe-area-inset-top) - 16px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--kart);
      border-radius: 18px 18px 0 0;
      padding: 8px 16px calc(env(safe-area-inset-bottom) + 16px);
      transform: translateY(105%);
      transition: transform .3s ease;
      z-index: 20;
    }
    .panel.acik { transform: translateY(0); }
    .panel-ust {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 14px;
    }
    .panel-ust h2 { font-size: 18px; }
    .kapat {
      background: var(--arkaplan);
      border: none;
      width: 32px; height: 32px;
      border-radius: 50%;
      font-size: 16px;
      color: var(--soluk);
    }
    /* Panel açıkken arkadaki sayfa kaymasın */
    body.panel-acik { overflow: hidden; }

    /* Sağ altta, sekme çubuğunun üstünde yüzen "Ekle" düğmesi (Sürüm 0.4) */
    .ekle-dugmesi {
      position: fixed;
      right: 20px;
      bottom: calc(env(safe-area-inset-bottom) * 0.5 + 76px);
      width: 58px; height: 58px;
      border-radius: 50%;
      border: none;
      background: var(--vurgu);
      color: var(--buton-yazi, #fff);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .3);
      z-index: 5;
      transition: transform .15s;
    }
    .ekle-dugmesi:active { transform: scale(.92); }
    .ekle-dugmesi svg { width: 26px; height: 26px; }

    /* Litre / fiyat / tutar: üç kutu yan yana */
    .uclu { display: flex; gap: 8px; }
    .uclu .alan { flex: 1; min-width: 0; }
    .uclu .alan input { padding: 12px 8px; }

    /* Otomatik hesaplanan kutu soluk görünür, etiketinde "oto" yazar */
    .alan input.oto { color: var(--soluk); border-style: dashed; }
    .oto-etiket {
      display: none;
      font-size: 10px;
      font-weight: 600;
      color: var(--vurgu);
      margin-left: 4px;
    }
    .alan.oto-alan .oto-etiket { display: inline; }

    /* ---------- KAYIT LİSTESİ (Adım 4 / Sürüm 0.5) ---------- */
    /* Ay başlığı: "Ekim 2026" ve o ayın toplamları */
    .ay-baslik {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 18px 4px 8px;
      font-size: 15px;
      font-weight: 600;
    }
    .ay-baslik:first-child { margin-top: 0; }
    .ay-baslik small { font-size: 12px; font-weight: 500; color: var(--soluk); }

    .liste-kart {
      background: var(--kart);
      border: 1px solid var(--cizgi);
      border-radius: 14px;
      overflow: hidden;
    }
    /* Bir dolum satırı (dokununca düzenleme açılır) */
    .satir {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 14px;
      background: none;
      border: none;
      border-top: 1px solid var(--cizgi);
      color: var(--yazi);
      font-family: inherit;
      text-align: left;
    }
    .satir:first-child { border-top: none; }
    .satir:active { background: var(--arkaplan); }

    /* Soldaki tür rozeti: LPG mavi, Benzin turuncu */
    .rozet {
      flex: none;
      width: 54px;
      padding: 5px 0;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      color: #fff;
    }
    .rozet.LPG { background: var(--lpg); }
    .rozet.BENZIN { background: var(--benzin); }
    .rozet.DIZEL { background: var(--dizel); }

    .satir-orta { flex: 1; min-width: 0; }
    .satir-ust { font-size: 15px; font-weight: 600; }
    .satir-alt {
      font-size: 13px;
      color: var(--soluk);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .satir-sag { flex: none; text-align: right; }
    .satir-tutar { font-size: 16px; font-weight: 700; }
    .satir-km { font-size: 12px; color: var(--soluk); margin-top: 2px; }

    /* Hiç kayıt yokken */
    .bos-liste { text-align: center; padding: 40px 20px; }
    .bos-liste .bilgi { margin-top: 6px; }

    /* Düzenlemedeki "Kaydı sil" düğmesi */
    .sil-dugmesi {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      border-radius: 12px;
      border: 1px solid #dc2626;
      background: none;
      color: #dc2626;
    }
    .sil-dugmesi.onay { background: #dc2626; color: #fff; }

    /* ---------- ÖZET (Adım 5 / Sürüm 0.6) ---------- */
    .ay-secici {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .ay-secici span { font-size: 17px; font-weight: 600; }
    .ay-secici button {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--cizgi);
      background: var(--kart);
      color: var(--yazi);
      font-size: 22px;
      line-height: 1;
      font-family: inherit;
    }
    .ay-secici button:disabled { opacity: .3; }
    .kart-alt { font-size: 13px; color: var(--soluk); margin-top: 6px; line-height: 1.5; white-space: pre-line; }

    /* ---------- AY / YIL GÖRÜNÜMÜ, KARŞILAŞTIRMA, GRAFİKLER (Sürüm 1.5) ---------- */
    .gorunum-secim { margin-bottom: 12px; }
    .karsilastirma { font-size: 13px; margin-top: 4px; color: var(--soluk); }
    .karsilastirma b { font-weight: 600; color: var(--yazi); }
    .grafik-kart h2 { margin-bottom: 4px; }
    .lejant { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--soluk); margin: 2px 0 6px; }
    .lejant span { display: inline-flex; align-items: center; gap: 6px; }
    .lejant i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .grafik { display: block; width: 100%; overflow: visible; touch-action: pan-y; }
    .grafik text { font-size: 11px; fill: var(--soluk); font-family: inherit; }
    .grafik .izgara { stroke: var(--cizgi); stroke-width: 1; }
    .grafik .soluk { opacity: .35; }
    .grafik .imlec { stroke: var(--soluk); stroke-width: 1; stroke-dasharray: 3 3; }
    .grafik-detay { font-size: 13px; color: var(--yazi); min-height: 38px; line-height: 1.45; margin-top: 4px; }
    .grafik-detay small { color: var(--soluk); font-size: 12px; }

    /* ---------- FİŞ OKUMA (Adım 6 / Sürüm 0.7) ---------- */
    /* ---------- YEDEKLEME (Adım 7 / Sürüm 0.8) ---------- */
    .yedek-kart { margin-top: 18px; }
    /* Yakıt ayarları kartı (Sürüm 1.4) */
    .ayar-baslik { font-size: 13px; color: var(--soluk); margin: 12px 0 6px; }
    .ayar-kart .ipucu { min-height: 0; }
    .yedek-dugmeler { margin-top: 12px; }
    .ikincil-dugme {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      border-radius: 12px;
      border: 1px solid var(--cizgi);
      background: var(--arkaplan);
      color: var(--yazi);
    }
    .ikincil-dugme:active { opacity: .7; }
    .ikincil-dugme:disabled { opacity: .5; }
    #yedek-durum { margin: 10px 0 0; }

    .fis-dugmesi {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      border-radius: 12px;
      border: 1.5px dashed var(--vurgu);
      background: none;
      color: var(--vurgu);
    }
    .fis-dugmesi svg { width: 22px; height: 22px; }
    .fis-dugmesi:disabled { opacity: .5; }
    .fis-durum { font-size: 13px; color: var(--soluk); min-height: 18px; margin-bottom: 10px; line-height: 1.4; }
    .fis-durum.uyari { color: #d97706; }
    .fis-durum.hata { color: #dc2626; }
    /* Fişten doldurulan kutular kısa süre yeşil parlar */
    .alan input.okundu { outline: 2px solid var(--vurgu); }
  </style>
</head>
<body>

  <!-- ===================================================
       BÖLÜM 3: ÜST BAŞLIK
       =================================================== -->
  <header>
    <h1 id="baslik">Özet</h1>
    <!-- Sürüm numarası: güncellemenin telefona gelip gelmediğini anlamak için -->
    <small id="surum"></small>
  </header>

  <main>
    <!-- ===================================================
         BÖLÜM 4: SAYFA — ÖZET (ana sayfa)
         =================================================== -->
    <section class="sayfa aktif" id="sayfa-ozet">
      <!-- Ay / Yıl görünümü (Sürüm 1.5) -->
      <div class="secim gorunum-secim" id="gorunum-secim">
        <input type="radio" name="gorunum" id="gorunum-ay" value="ay" checked><label for="gorunum-ay">Ay</label>
        <input type="radio" name="gorunum" id="gorunum-yil" value="yil"><label for="gorunum-yil">Yıl</label>
      </div>
      <!-- Dönem seçici: ‹ Ekim 2026 › ya da ‹ 2026 › (Sürüm 0.6, 1.5'te yıl) -->
      <div class="ay-secici">
        <button type="button" id="ay-geri" aria-label="Önceki dönem">‹</button>
        <span id="ay-adi"></span>
        <button type="button" id="ay-ileri" aria-label="Sonraki dönem">›</button>
      </div>

      <!-- Yıl özeti: sadece yıl görünümünde (Sürüm 1.5) -->
      <div class="kart" id="kart-yil" hidden>
        <h2>Yıl toplamı</h2>
        <div class="deger" id="ozet-yil">— ₺</div>
        <div class="kart-alt" id="ozet-yil-alt"></div>
        <div class="karsilastirma" id="ozet-yil-fark"></div>
      </div>

      <!-- Yakıt kartları: ayarlarda seçili yakıtlar ve o ay kaydı olan yakıtlar görünür (Sürüm 1.4) -->
      <div class="kart" id="kart-LPG">
        <h2>LPG</h2>
        <div class="deger lpg-renk" id="ozet-LPG">— ₺</div>
        <div class="kart-alt" id="ozet-LPG-alt"></div>
        <div class="karsilastirma" id="ozet-LPG-fark"></div>
      </div>
      <div class="kart" id="kart-BENZIN">
        <h2>Benzin</h2>
        <div class="deger benzin-renk" id="ozet-BENZIN">— ₺</div>
        <div class="kart-alt" id="ozet-BENZIN-alt"></div>
        <div class="karsilastirma" id="ozet-BENZIN-fark"></div>
      </div>
      <div class="kart" id="kart-DIZEL">
        <h2>Dizel</h2>
        <div class="deger dizel-renk" id="ozet-DIZEL">— ₺</div>
        <div class="kart-alt" id="ozet-DIZEL-alt"></div>
        <div class="karsilastirma" id="ozet-DIZEL-fark"></div>
      </div>
      <div class="kart">
        <h2>Km başı toplam maliyet</h2>
        <div class="deger vurgu-renk" id="ozet-km">— ₺/km</div>
        <div class="kart-alt" id="ozet-km-alt"></div>
        <div class="karsilastirma" id="ozet-km-fark"></div>
      </div>

      <!-- Grafikler (Sürüm 1.5): ay görünümünde seçili aya kadar son 12 ay, yıl görünümünde o yılın 12 ayı.
           Bir aya dokununca altında o ayın rakamları yazar. -->
      <div class="kart grafik-kart" id="kart-harcama-grafik">
        <h2 id="harcama-grafik-baslik">Aylık harcama</h2>
        <div class="lejant" id="harcama-lejant"></div>
        <svg class="grafik" id="harcama-grafik" role="img" aria-label="Aylık yakıt harcaması grafiği"></svg>
        <div class="grafik-detay" id="harcama-detay"></div>
      </div>
      <div class="kart grafik-kart" id="kart-fiyat-grafik">
        <h2>Litre fiyatı (aylık ortalama ₺/L)</h2>
        <div class="lejant" id="fiyat-lejant"></div>
        <svg class="grafik" id="fiyat-grafik" role="img" aria-label="Aylık ortalama litre fiyatı grafiği"></svg>
        <div class="grafik-detay" id="fiyat-detay"></div>
      </div>
    </section>

    <!-- ===================================================
         BÖLÜM 6: SAYFA — KAYITLAR (liste)
         =================================================== -->
    <section class="sayfa" id="sayfa-kayitlar">

  <div class="perde" id="perde"></div>
