  <!-- ===================================================
       BÖLÜM 8: JAVASCRIPT (UYGULAMA MANTIĞI)
       =================================================== -->
  <script>
    // --- Sürüm: her güncellemede bu numarayı artıracağız ---
    const SURUM = "1.5";
    document.getElementById("surum").textContent = "Sürüm " + SURUM;

    // --- Sekme geçişi ---
    // Alttaki bir butona basılınca ilgili sayfayı gösterir, diğerlerini gizler
    function sayfaAc(ad, baslik) {
      document.querySelectorAll(".sayfa").forEach(s => s.classList.remove("aktif"));
      document.getElementById("sayfa-" + ad).classList.add("aktif");

      document.querySelectorAll("nav button").forEach(b => {
        b.classList.toggle("aktif", b.dataset.sayfa === ad);
      });

      document.getElementById("baslik").textContent = baslik;
      window.scrollTo(0, 0);
      // Gizliyken çizilen grafiklerin genişliği yanlış olur: Özet açılınca yeniden çiz (Sürüm 1.5)
      if (ad === "ozet") ozetGuncelle();
    }

    // Sadece sayfa açan düğmeler (Özet, Kayıtlar). "Ekle" paneli ayrıca açılır.
    document.querySelectorAll("nav button[data-sayfa]").forEach(buton => {
      buton.addEventListener("click", () => {
        sayfaAc(buton.dataset.sayfa, buton.dataset.baslik);
      });
    });

    // =====================================================
    // VERİ KATMANI (Adım 2)
    // Kayıtlar telefonda localStorage içinde JSON olarak durur
    // =====================================================
    const DEPO_ANAHTARI = "yakitKayitlari_v1";

    // Tüm kayıtları okur (hiç yoksa boş liste döner)
    function kayitlariOku() {
      try {
        const veri = localStorage.getItem(DEPO_ANAHTARI);
        return veri ? JSON.parse(veri) : [];
      } catch (e) {
        console.error("Kayıtlar okunamadı:", e);
        return [];
      }
    }

    // Tüm kayıtları yazar (başarılıysa true döner)
    function kayitlariYaz(kayitlar) {
      try {
        localStorage.setItem(DEPO_ANAHTARI, JSON.stringify(kayitlar));
        return true;
      } catch (e) {
        alert("Kayıt yapılamadı. Telefonda yer kalmamış olabilir.");
        return false;
      }
    }

    // Yeni kayıt ekler (benzersiz id'yi kendisi verir)
    function kayitEkle(kayit) {
      const kayitlar = kayitlariOku();
      kayit.id = Date.now().toString();
      kayitlar.push(kayit);
      return kayitlariYaz(kayitlar);
    }

    // Var olan kaydı günceller (Adım 4'te düzenleme için kullanılacak)
    function kayitGuncelle(id, yeniBilgiler) {
      const kayitlar = kayitlariOku();
      const sira = kayitlar.findIndex(k => k.id === id);
      if (sira === -1) return false;
      kayitlar[sira] = { ...kayitlar[sira], ...yeniBilgiler, id: id };
      return kayitlariYaz(kayitlar);
    }

    // Kaydı siler (Adım 4'te kullanılacak)
    function kayitSil(id) {
      return kayitlariYaz(kayitlariOku().filter(k => k.id !== id));
    }

    // Kayıtları tarih + saate göre eskiden yeniye sıralı verir
    function siraliKayitlar() {
      return kayitlariOku().sort((a, b) =>
        (a.tarih + (a.saat || "")).localeCompare(b.tarih + (b.saat || ""))
      );
    }

    // =====================================================
    // YAKIT TÜRLERİ VE AYARLAR (Sürüm 1.4)
    // Kod: kayıtlarda saklanan değer. Ad: ekranda. Rozet: listedeki kısa etiket.
    // Ayarlar: hangi yakıtlar kullanılıyor + km hangi yakıtın dolumunda giriliyor ("ana yakıt").
    // Km sayacı sadece ana yakıt alınınca sıfırlandığı için, ana yakıtın gidilen km'si
    // aradaki diğer yakıtlarla gidilen yolu da içerir. Km başı maliyet bu yüzden doğru çıkar.
    // =====================================================
    const YAKITLAR = [
      { kod: "LPG",    ad: "LPG",    rozet: "LPG" },
      { kod: "BENZIN", ad: "Benzin", rozet: "BENZİN" },
      { kod: "DIZEL",  ad: "Dizel",  rozet: "DİZEL" }
    ];
    const YAKIT_KODLARI = YAKITLAR.map(y => y.kod);
    const yakitAdi = kod => (YAKITLAR.find(y => y.kod === kod) || YAKITLAR[0]).ad;
    const yakitRozeti = kod => (YAKITLAR.find(y => y.kod === kod) || YAKITLAR[0]).rozet;

    const AYAR_ANAHTARI = "yakitAyarlar_v1";
    // Varsayılan: LPG + benzin, km LPG'de (1.4 öncesi davranışla aynı)
    const VARSAYILAN_AYARLAR = { yakitlar: ["LPG", "BENZIN"], anaYakit: "LPG" };

    function ayarlariOku() {
      let a = null;
      try { a = JSON.parse(localStorage.getItem(AYAR_ANAHTARI)); } catch (e) {}
      if (!a || !Array.isArray(a.yakitlar)) return { ...VARSAYILAN_AYARLAR };
      // Bozuk değerleri ayıkla: bilinen yakıtlar, en az bir tane, ana yakıt seçililerden biri
      const yakitlar = YAKIT_KODLARI.filter(k => a.yakitlar.includes(k));
      if (!yakitlar.length) return { ...VARSAYILAN_AYARLAR };
      return { yakitlar, anaYakit: yakitlar.includes(a.anaYakit) ? a.anaYakit : yakitlar[0] };
    }
    function ayarlariYaz(a) {
      try { localStorage.setItem(AYAR_ANAHTARI, JSON.stringify(a)); } catch (e) {}
    }

    // Safari'den verileri kendiliğinden silmemesini rica et
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist();
    }

    // =====================================================
    // KAYIT FORMU (Adım 3)
    // =====================================================
    const el = id => document.getElementById(id);
    const form = el("kayit-formu");
    const paraBicim = new Intl.NumberFormat("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    // "32,15" veya "32.15" → 32.15   |   "1.234,56" → 1234.56
    function sayiyaCevir(metin) {
      if (!metin) return NaN;
      let s = metin.trim().replace(/\s/g, "");
      if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
      return parseFloat(s);
    }

    // Kilometre kutusundaki rakamları tam sayıya çevirir ("128.450" → 128450)
    // Gidilen km: ondalıklı olabilir ("281,1" → 281.1) (Sürüm 1.2)
    function kmOku() {
      const km = sayiyaCevir(el("f-km").value);
      return isNaN(km) ? NaN : Math.round(km * 10) / 10;
    }
    // km'yi Türkçe yazar: 281.1 → "281,1", 5304.1 → "5.304,1"
    function kmYazisi(km) {
      return km.toLocaleString("tr-TR", { maximumFractionDigits: 1 });
    }

    function seciliTur()    { return form.querySelector('input[name="tur"]:checked').value; }
    function ikiHane(n)     { return String(n).padStart(2, "0"); }

    // Düzenlenen kaydın kimliği (yeni kayıtta null)
    let duzenlenenId = null;

    // -----------------------------------------------------
    // LİTRE / FİYAT / TUTAR üçlüsü (Sürüm 0.3)
    // Kural: en son ELLE yazılan iki kutu "kaynak"tır, üçüncüsü hesaplanır.
    // Hesaplanan kutuya elle yazılırsa o da kaynak olur; en eski kaynak
    // hesaplanana döner. Böylece üç değer hiçbir zaman çelişmez.
    // -----------------------------------------------------
    const UCLU = ["f-litre", "f-fiyat", "f-tutar"];
    let elleYazilanlar = [];   // elle yazılan kutular, eskiden yeniye

    // Bir kutu elle değiştirilince çağrılır
    function ucluElleDegisti(id) {
      elleYazilanlar = elleYazilanlar.filter(x => x !== id);
      // Kutu boşaltıldıysa artık kaynak değildir
      if (el(id).value.trim() !== "") elleYazilanlar.push(id);
      // Sadece son ikisi kaynak sayılır
      if (elleYazilanlar.length > 2) elleYazilanlar = elleYazilanlar.slice(-2);
      el(id).classList.remove("oto");
      el(id).closest(".alan").classList.remove("oto-alan");
      ucluHesapla();
    }

    // Kaynak iki kutudan üçüncüsünü hesaplar ve "oto" olarak işaretler
    function ucluHesapla() {
      // Önce önceden hesaplanmış kutuyu temizle
      UCLU.forEach(id => {
        if (el(id).classList.contains("oto")) {
          el(id).value = "";
          el(id).classList.remove("oto");
          el(id).closest(".alan").classList.remove("oto-alan");
        }
      });
      if (elleYazilanlar.length < 2) return;

      const hedef = UCLU.find(id => !elleYazilanlar.includes(id));
      const litre = sayiyaCevir(el("f-litre").value);
      const fiyat = sayiyaCevir(el("f-fiyat").value);
      const tutar = sayiyaCevir(el("f-tutar").value);

      let sonuc = NaN;
      if (hedef === "f-tutar") sonuc = litre * fiyat;
      if (hedef === "f-litre") sonuc = fiyat > 0 ? tutar / fiyat : NaN;
      if (hedef === "f-fiyat") sonuc = litre > 0 ? tutar / litre : NaN;

      if (isFinite(sonuc) && sonuc > 0) {
        el(hedef).value = paraBicim.format(sonuc);
        el(hedef).classList.add("oto");
        el(hedef).closest(".alan").classList.add("oto-alan");
      }
    }

    // Formdan değerleri dışarıdan doldurmak için (fiş okuma ve düzenleme bunu kullanacak)
    // Verilen değerlerden en fazla ikisi kaynak olur (öncelik: litre+tutar, sonra fiyat+tutar)
    function ucluDoldur(litre, tutar, fiyat) {
      const degerler = { "f-litre": litre, "f-tutar": tutar, "f-fiyat": fiyat };
      let kaynaklar = ["f-litre", "f-tutar", "f-fiyat"].filter(id => degerler[id] > 0).slice(0, 2);
      UCLU.forEach(id => {
        el(id).value = kaynaklar.includes(id) ? paraBicim.format(degerler[id]) : "";
        el(id).classList.remove("oto");
        el(id).closest(".alan").classList.remove("oto-alan");
      });
      elleYazilanlar = kaynaklar;
      ucluHesapla();
    }

    // Düzenlenen kaydın açılıştaki km'si (ana yakıt sonradan değiştiyse eski km kaybolmasın diye)
    let duzenlenenKm = null;

    // Km bölümü: ana yakıtta görünür ve zorunludur, diğer yakıtlarda gizlenir (Sürüm 1.4).
    // İstisna: düzenlenen kayıtta zaten km varsa (ana yakıt sonradan değişmiş) isteğe bağlı görünür.
    function kmZorunlu() { return seciliTur() === ayarlariOku().anaYakit; }
    function kmIpucuGoster() {
      const zorunlu = kmZorunlu();
      el("km-blok").hidden = !zorunlu && duzenlenenKm == null;
      el("km-ipucu").classList.remove("hata");
      el("km-ipucu").textContent = zorunlu
        ? "Bir önceki " + yakitAdi(seciliTur()) + " dolumundan bu yana gidilen kilometre"
        : "İsteğe bağlı (km artık " + yakitAdi(ayarlariOku().anaYakit) + " dolumunda giriliyor)";
    }

    // Yakıt türü düğmeleri: ayarlarda seçili yakıtlar + (düzenlemede) kaydın kendi türü görünür.
    // Tek seçenek kalırsa bölüm tamamen gizlenir.
    function turSecimGuncelle() {
      const ayar = ayarlariOku();
      const secili = seciliTur();
      let gorunenler = 0;
      YAKIT_KODLARI.forEach(kod => {
        const gorunsun = ayar.yakitlar.includes(kod) || kod === secili;
        el("tur-" + kod).hidden = !gorunsun;
        form.querySelector('label[for="tur-' + kod + '"]').hidden = !gorunsun;
        if (gorunsun) gorunenler++;
      });
      el("tur-blok").hidden = gorunenler < 2;
    }
    // Yakıt türünü seçer (ekranda görünmüyorsa görünür yapar)
    function turSec(kod) {
      if (!YAKIT_KODLARI.includes(kod)) kod = ayarlariOku().anaYakit;
      el("tur-" + kod).checked = true;
      turSecimGuncelle();
      kmIpucuGoster();
    }

    // Daha önce yazılmış istasyon adlarını öneri listesine koyar
    function istasyonListesiDoldur() {
      const liste = el("istasyon-listesi");
      const adlar = [...new Set(kayitlariOku().map(k => k.istasyon).filter(Boolean))];
      liste.innerHTML = "";
      adlar.forEach(ad => {
        const secenek = document.createElement("option");
        secenek.value = ad;
        liste.appendChild(secenek);
      });
    }

    // Formu temizler, tarih/saati şu ana ayarlar. Yakıt türü ana yakıta döner (Sürüm 1.4).
    function formuSifirla() {
      duzenlenenKm = null;
      turSec(ayarlariOku().anaYakit);
      const simdi = new Date();
      el("f-tarih").value = simdi.getFullYear() + "-" + ikiHane(simdi.getMonth() + 1) + "-" + ikiHane(simdi.getDate());
      el("f-saat").value = ikiHane(simdi.getHours()) + ":" + ikiHane(simdi.getMinutes());
      ["f-km", "f-istasyon"].forEach(id => el(id).value = "");
      ucluDoldur(null, null);
      el("form-hata").textContent = "";
      fisDurum("");
      kmIpucuGoster();
      istasyonListesiDoldur();
    }

    // Kutulara her yazıldığında / seçim değiştiğinde açıklamaları yenile
    form.addEventListener("input", olay => {
      if (UCLU.includes(olay.target.id)) ucluElleDegisti(olay.target.id);
      kmIpucuGoster();
    });
    form.addEventListener("change", kmIpucuGoster);

    // -----------------------------------------------------
    // AÇILIR PANEL (Sürüm 0.3)
    // -----------------------------------------------------
    // kayit verilirse panel "düzenleme" modunda, o kaydın bilgileriyle açılır
    function paneliAc(kayit) {
      formuSifirla();
      duzenlenenId = null;
      el("panel-baslik").textContent = "Yeni Kayıt";
      silOnayiniSifirla();
      el("sil-dugmesi").hidden = true;

      if (kayit && kayit.id) {
        duzenlenenId = kayit.id;
        el("panel-baslik").textContent = "Kaydı Düzenle";
        el("sil-dugmesi").hidden = false;
        duzenlenenKm = typeof kayit.gidilenKm === "number" ? kayit.gidilenKm : null;
        turSec(kayit.tur);
        el("f-tarih").value = kayit.tarih;
        el("f-saat").value = kayit.saat || "";
        el("f-istasyon").value = kayit.istasyon || "";
        ucluDoldur(kayit.litre, kayit.tutar);
        el("f-km").value = kayit.gidilenKm ? kmYazisi(kayit.gidilenKm).replace(/\./g, "") : "";
        kmIpucuGoster();
      }

      el("ekle-paneli").scrollTop = 0;
      el("ekle-paneli").classList.add("acik");
      el("perde").classList.add("acik");
      document.body.classList.add("panel-acik");
    }
    function paneliKapat() {
      document.activeElement && document.activeElement.blur(); // klavyeyi kapat
      el("ekle-paneli").classList.remove("acik");
      el("perde").classList.remove("acik");
      document.body.classList.remove("panel-acik");
    }
    el("ekle-dugmesi").addEventListener("click", () => paneliAc());

    // "Kaydı sil": ilk dokunuşta kırmızıya döner ve onay ister, 3 sn içinde ikinci dokunuş siler
    function silOnayiniSifirla() {
      const d = el("sil-dugmesi");
      d.classList.remove("onay");
      d.textContent = "Kaydı sil";
      clearTimeout(d.zamanlayici);
    }
    el("sil-dugmesi").addEventListener("click", () => {
      const d = el("sil-dugmesi");
      if (!d.classList.contains("onay")) {
        d.classList.add("onay");
        d.textContent = "Silmek için tekrar dokun";
        d.zamanlayici = setTimeout(silOnayiniSifirla, 3000);
        return;
      }
      if (duzenlenenId && kayitSil(duzenlenenId)) {
        paneliKapat();
        bildirimGoster("Kayıt silindi");
        hepsiniGuncelle();
      }
    });
    el("panel-kapat").addEventListener("click", paneliKapat);
    el("perde").addEventListener("click", paneliKapat);   // boş yere dokununca kapanır

    // "Kaydet" butonu
    form.addEventListener("submit", olay => {
      olay.preventDefault();
      const hataGoster = mesaj => { el("form-hata").textContent = mesaj; };

      const tur   = seciliTur();
      const tarih = el("f-tarih").value;
      const saat  = el("f-saat").value;
      const litre = sayiyaCevir(el("f-litre").value);
      const tutar = sayiyaCevir(el("f-tutar").value);
      const fiyat = sayiyaCevir(el("f-fiyat").value);
      const km    = kmOku();

      if (!tarih)                return hataGoster("Tarih girin.");
      if (!(litre > 0) || !(tutar > 0))
        return hataGoster("Litre, fiyat ve tutardan en az ikisini girin.");
      // Km: ana yakıtta zorunlu; diğer yakıtta sadece km bölümü görünüyorsa (eski km'li kayıt) isteğe bağlı
      const zorunlu = kmZorunlu();
      const kmGorunur = !el("km-blok").hidden;
      if (zorunlu && (isNaN(km) || km <= 0)) return hataGoster("Gidilen km'yi girin.");
      if (kmGorunur && km > 5000) return hataGoster("Gidilen km çok büyük. Sayaç değerini değil, gidilen km'yi girin.");
      const kaydedilecekKm = kmGorunur && km > 0 ? km : null;

      const kayit = {
        tur: tur,
        tarih: tarih,
        saat: saat,
        litre: litre,
        tutar: tutar,
        fiyat: fiyat > 0 ? fiyat : Math.round(tutar / litre * 100) / 100,   // litre fiyatı (₺/Lt)
        istasyon: el("f-istasyon").value.trim(),
        sayac: null,                                  // artık kullanılmıyor (Sürüm 1.1)
        gidilenKm: kaydedilecekKm                     // ana yakıt dışında km sorulmaz (Sürüm 1.4)
      };

      const basarili = duzenlenenId ? kayitGuncelle(duzenlenenId, kayit) : kayitEkle(kayit);
      if (basarili) {
        const mesaj = duzenlenenId ? "✓ Güncellendi" : "✓ Kaydedildi";
        paneliKapat();
        bildirimGoster(mesaj);
        hepsiniGuncelle();
      }
    });

    // =====================================================
    // KAYIT LİSTESİ (Adım 4 / Sürüm 0.5)
    // =====================================================
    const tlBicim = new Intl.NumberFormat("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const AY_ADLARI = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran",
                       "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];

    // HTML'e yazılacak metindeki özel karakterleri zararsız hale getirir
    function guvenli(metin) {
      return String(metin).replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // Bir kaydın gidilen km'si (yoksa null). Eski sayaçlı kayıtlar açılışta çevrilir.
    function gidilenKmBul(kayit) {
      return typeof kayit.gidilenKm === "number" ? kayit.gidilenKm : null;
    }

    // 100 km'de tüketim (L/100 km) — Sürüm 1.3, 1.4'te her yakıt türü için
    // Her dolum, bir önceki aynı tür dolumdan beri yakılanı yerine koyar; gidilen km de
    // tam o aralığı ölçer. Bu yüzden: (km'si olan kayıtların litresi ÷ km'si) × 100.
    // Km'si olmayan kayıtlar hesaba katılmaz (yoksa sonuç şişer). Sonuç yoksa null.
    // Not: çift yakıtlı araçta ana yakıtın km'si diğer yakıtla gidilen yolu da içerir,
    // bu yüzden ana yakıtın tüketimi biraz düşük görünür (kullanıcı şimdilik basit istedi).
    function yuzKmTuketim(kayitlar, tur) {
      const kmli = kayitlar.filter(k => k.tur === tur && gidilenKmBul(k) > 0);
      const km = kmli.reduce((t, k) => t + gidilenKmBul(k), 0);
      const litre = kmli.reduce((t, k) => t + k.litre, 0);
      return km > 0 ? litre / km * 100 : null;
    }
    const tuketimBicim = new Intl.NumberFormat("tr-TR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });

    // Eski sürümlerde sayaçla girilen kayıtları bir kereliğine gidilen km'ye çevirir:
    // aynı türdeki bir önceki sayaçlı kayıtla farkı alınır, ilk sayaç kaydında km boş kalır.
    function sayacKayitlariniCevir() {
      const kayitlar = kayitlariOku();
      if (!kayitlar.some(k => k.sayac != null)) return;
      const sirali = [...kayitlar].sort((a, b) =>
        (a.tarih + (a.saat || "")).localeCompare(b.tarih + (b.saat || "")));
      const sonSayac = {};   // tür → son sayaç değeri
      sirali.forEach(k => {
        if (k.sayac == null) return;
        if (k.gidilenKm == null && sonSayac[k.tur] != null && k.sayac > sonSayac[k.tur]) {
          k.gidilenKm = k.sayac - sonSayac[k.tur];
        }
        sonSayac[k.tur] = k.sayac;
      });
      kayitlar.forEach(k => { k.sayac = null; });
      kayitlariYaz(kayitlar);
    }

    function listeGuncelle() {
      const kutu = el("kayit-listesi");
      const sirali = siraliKayitlar();

      if (sirali.length === 0) {
        kutu.innerHTML =
          '<div class="kart bos-liste"><div class="satir-ust">Henüz kayıt yok</div>' +
          '<p class="bilgi">Sağ alttaki + düğmesiyle ilk dolumunu ekle.</p></div>';
        return;
      }

      // Yeniden eskiye, aylara göre grupla ("2026-10" → kayıtlar)
      const aylar = {};
      [...sirali].reverse().forEach(k => {
        const ay = k.tarih.slice(0, 7);
        (aylar[ay] = aylar[ay] || []).push(k);
      });

      let html = "";
      Object.keys(aylar).forEach(ay => {
        const kayitlar = aylar[ay];
        const [yil, ayNo] = ay.split("-");
        // Ay başlığında o ay kaydı olan her yakıtın toplamı (Sürüm 1.4)
        const toplamlar = YAKIT_KODLARI
          .map(kod => [kod, kayitlar.filter(k => k.tur === kod)])
          .filter(([, liste]) => liste.length)
          .map(([kod, liste]) => yakitAdi(kod) + " " + tlBicim.format(liste.reduce((t, k) => t + k.tutar, 0)) + " ₺");

        html += '<div class="ay-baslik"><span>' + AY_ADLARI[+ayNo - 1] + " " + yil + "</span><small>" +
          toplamlar.join(" · ") + "</small></div>";

        html += '<div class="liste-kart">';
        kayitlar.forEach(k => {
          const gun = +k.tarih.slice(8, 10);
          const fiyat = k.fiyat || (k.litre ? k.tutar / k.litre : 0);
          const km = gidilenKmBul(k);   // km sadece ana yakıt kayıtlarında olur
          const tur = YAKIT_KODLARI.includes(k.tur) ? k.tur : "LPG";
          const altSatir = [tlBicim.format(k.litre) + " L", tlBicim.format(fiyat) + " ₺/L"];
          if (k.istasyon) altSatir.push(guvenli(k.istasyon));

          html +=
            '<button type="button" class="satir" data-id="' + guvenli(k.id) + '">' +
              '<span class="rozet ' + tur + '">' + yakitRozeti(tur) + "</span>" +
              '<span class="satir-orta">' +
                '<div class="satir-ust">' + gun + " " + AY_ADLARI[+ayNo - 1] + (k.saat ? " · " + guvenli(k.saat) : "") + "</div>" +
                '<div class="satir-alt">' + altSatir.join(" · ") + "</div>" +
              "</span>" +
              '<span class="satir-sag">' +
                '<div class="satir-tutar">' + tlBicim.format(k.tutar) + " ₺</div>" +
                '<div class="satir-km">' + (km != null ? kmYazisi(km) + " km · " +
                  tuketimBicim.format(k.litre / km * 100) + " L/100" : "") + "</div>" +
              "</span>" +
            "</button>";
        });
        html += "</div>";
      });
      kutu.innerHTML = html;
    }

    // Listedeki bir satıra dokununca o kayıt düzenleme modunda açılır
    el("kayit-listesi").addEventListener("click", olay => {
      const satir = olay.target.closest(".satir");
      if (!satir) return;
      const kayit = kayitlariOku().find(k => k.id === satir.dataset.id);
      if (kayit) paneliAc(kayit);
    });

    // Kayıtlar değişince listeyi ve özeti birlikte yenile
    function hepsiniGuncelle() {
      listeGuncelle();
      ozetGuncelle();
      yedekBilgisiGoster();
    }

    // =====================================================
    // YEDEKLEME (Adım 7 / Sürüm 0.8)
    // Yedek al: kayıtlar JSON dosyasına yazılır, iPhone paylaşım menüsü açılır
    //           ("Dosyalara Kaydet" ile iCloud Drive / telefona). Paylaşım yoksa indirilir.
    // Geri yükle: dosyadaki kayıtlar mevcut kayıtlara EKLENİR. Aynı kimlikli kayıt
    //             tekrar eklenmez, hiçbir kayıt silinmez.
    // =====================================================
    const SON_YEDEK_ANAHTARI = "yakitSonYedek_v1";

    function yedekDurum(mesaj, tur) {
      const d = el("yedek-durum");
      d.textContent = mesaj;
      d.className = "fis-durum" + (tur ? " " + tur : "");
    }

    function tarihYazisi(isoTarih) {
      const t = new Date(isoTarih);
      return t.getDate() + " " + AY_ADLARI[t.getMonth()] + " " + t.getFullYear();
    }

    function yedekBilgisiGoster() {
      let son = null;
      try { son = localStorage.getItem(SON_YEDEK_ANAHTARI); } catch (e) {}
      const sayi = kayitlariOku().length;
      let yazi = sayi + " kayıt telefonda. ";
      if (!son) {
        yazi += sayi ? "Henüz yedek alınmadı." : "";
      } else {
        const gun = Math.floor((Date.now() - new Date(son)) / 86400000);
        yazi += "Son yedek: " + tarihYazisi(son) + (gun > 30 ? " (bir aydan eski, yeni yedek al)" : "");
      }
      el("yedek-bilgi").textContent = yazi.trim();
    }

    el("yedek-al").addEventListener("click", async () => {
      const kayitlar = kayitlariOku();
      if (!kayitlar.length) return yedekDurum("Yedeklenecek kayıt yok.", "uyari");

      const simdi = new Date();
      const dosyaAdi = "yakit-yedek-" + simdi.getFullYear() + "-" + ikiHane(simdi.getMonth() + 1) + "-" +
        ikiHane(simdi.getDate()) + ".json";
      const icerik = JSON.stringify({
        uygulama: "yakit-takip",
        surum: SURUM,
        yedekTarihi: simdi.toISOString(),
        kayitlar: kayitlar
      }, null, 1);
      const dosya = new File([icerik], dosyaAdi, { type: "application/json" });

      const basarili = () => {
        try { localStorage.setItem(SON_YEDEK_ANAHTARI, simdi.toISOString()); } catch (e) {}
        yedekBilgisiGoster();
        yedekDurum("✓ " + kayitlar.length + " kayıt yedeklendi (" + dosyaAdi + ").");
      };

      // iPhone: paylaşım menüsü → "Dosyalara Kaydet"
      if (navigator.canShare && navigator.canShare({ files: [dosya] })) {
        try {
          await navigator.share({ files: [dosya] });
          basarili();
        } catch (e) {
          if (e.name !== "AbortError") yedekDurum("Paylaşım açılamadı: " + e.message, "hata");
          // AbortError: kullanıcı paylaşımı kapattı, yedek alınmış sayılmaz
        }
        return;
      }

      // Paylaşım yoksa (bilgisayar tarayıcısı): dosyayı indir
      const adres = URL.createObjectURL(dosya);
      const a = document.createElement("a");
      a.href = adres;
      a.download = dosyaAdi;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(adres), 2000);
      basarili();
    });

    // -----------------------------------------------------
    // EXCEL'E AKTARMA (Sürüm 1.5)
    // CSV: Türkçe Excel'in beklediği biçim — ayırıcı ";" , ondalık virgül, tarih GG.AA.YYYY,
    // başta UTF-8 işareti (BOM) ki Türkçe harfler bozuk çıkmasın. Eskiden yeniye sıralı.
    // iPhone'da paylaşım menüsü (Dosyalara Kaydet / e-posta), yoksa indirme.
    // -----------------------------------------------------
    function csvHucre(deger) {
      const s = deger == null ? "" : String(deger);
      return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }
    const csvSayi = (n, hane) => typeof n === "number" && isFinite(n) ? n.toFixed(hane).replace(".", ",") : "";

    function csvOlustur(kayitlar) {
      const satirlar = [["Tarih", "Saat", "Yakıt", "Litre", "Litre Fiyatı (₺)", "Tutar (₺)", "Gidilen KM", "L/100 km", "İstasyon"]];
      kayitlar.forEach(k => {
        const km = gidilenKmBul(k);
        const fiyat = k.fiyat || (k.litre ? k.tutar / k.litre : null);
        satirlar.push([
          k.tarih.slice(8, 10) + "." + k.tarih.slice(5, 7) + "." + k.tarih.slice(0, 4),
          k.saat || "",
          yakitAdi(k.tur),
          csvSayi(k.litre, 2),
          csvSayi(fiyat, 2),
          csvSayi(k.tutar, 2),
          km != null ? csvSayi(km, 1) : "",
          km > 0 ? csvSayi(k.litre / km * 100, 1) : "",
          k.istasyon || ""
        ]);
      });
      return "﻿" + satirlar.map(s => s.map(csvHucre).join(";")).join("\r\n") + "\r\n";
    }

    el("csv-aktar").addEventListener("click", async () => {
      const kayitlar = siraliKayitlar();
      if (!kayitlar.length) return yedekDurum("Aktarılacak kayıt yok.", "uyari");
      const simdi = new Date();
      const dosyaAdi = "yakit-kayitlari-" + simdi.getFullYear() + "-" + ikiHane(simdi.getMonth() + 1) + "-" +
        ikiHane(simdi.getDate()) + ".csv";
      const dosya = new File([csvOlustur(kayitlar)], dosyaAdi, { type: "text/csv" });
      const tamam = () => yedekDurum("✓ " + kayitlar.length + " kayıt Excel dosyasına aktarıldı (" + dosyaAdi + ").");

      if (navigator.canShare && navigator.canShare({ files: [dosya] })) {
        try {
          await navigator.share({ files: [dosya] });
          tamam();
        } catch (e) {
          if (e.name !== "AbortError") yedekDurum("Paylaşım açılamadı: " + e.message, "hata");
        }
        return;
      }
      const adres = URL.createObjectURL(dosya);
      const a = document.createElement("a");
      a.href = adres;
      a.download = dosyaAdi;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(adres), 2000);
      tamam();
    });

    // Bir kaydın yapısı doğru mu? (bozuk ya da başka dosyadan gelen veriyi alma)
    function gecerliKayit(k) {
      return k && typeof k === "object" &&
        typeof k.id === "string" && k.id &&
        YAKIT_KODLARI.includes(k.tur) &&
        /^\d{4}-\d{2}-\d{2}$/.test(k.tarih) &&
        typeof k.litre === "number" && k.litre > 0 &&
        typeof k.tutar === "number" && k.tutar > 0;
    }

    el("yedek-yukle").addEventListener("click", () => el("yedek-dosya").click());

    el("yedek-dosya").addEventListener("change", async () => {
      const dosya = el("yedek-dosya").files[0];
      el("yedek-dosya").value = "";
      if (!dosya) return;
      try {
        const veri = JSON.parse(await dosya.text());
        const gelen = Array.isArray(veri) ? veri : veri && veri.kayitlar;
        if (!Array.isArray(gelen)) throw new Error("bu bir yedek dosyası değil");

        const mevcut = kayitlariOku();
        const kimlikler = new Set(mevcut.map(k => k.id));
        let eklenen = 0, zatenVar = 0, hatali = 0;
        gelen.forEach(k => {
          if (!gecerliKayit(k)) { hatali++; return; }
          if (kimlikler.has(k.id)) { zatenVar++; return; }
          // Aynı dolum başka yoldan (ör. fişten) zaten girilmişse ekleme: aynı tür + tarih + litre
          if (mevcut.some(m => m.tur === k.tur && m.tarih === k.tarih && Math.abs(m.litre - k.litre) < 0.02)) {
            zatenVar++; return;
          }
          // Sadece bilinen alanları al
          mevcut.push({
            id: k.id, tur: k.tur, tarih: k.tarih, saat: typeof k.saat === "string" ? k.saat : "",
            litre: k.litre, tutar: k.tutar,
            fiyat: typeof k.fiyat === "number" ? k.fiyat : Math.round(k.tutar / k.litre * 100) / 100,
            istasyon: typeof k.istasyon === "string" ? k.istasyon.slice(0, 60) : "",
            sayac: typeof k.sayac === "number" ? k.sayac : null,
            gidilenKm: typeof k.gidilenKm === "number" ? k.gidilenKm : null
          });
          kimlikler.add(k.id);
          eklenen++;
        });

        if (eklenen && !kayitlariYaz(mevcut)) return;
        sayacKayitlariniCevir();
        hepsiniGuncelle();
        let mesaj = (eklenen ? "✓ " + eklenen + " kayıt eklendi." : "Yeni kayıt yok.") +
          (zatenVar ? " " + zatenVar + " kayıt zaten vardı." : "") +
          (hatali ? " " + hatali + " bozuk kayıt atlandı." : "");
        yedekDurum(mesaj, hatali ? "uyari" : "");
      } catch (e) {
        yedekDurum(e instanceof SyntaxError
          ? "Dosya okunamadı: dosya bozuk ya da yedek dosyası değil."
          : "Dosya okunamadı: " + e.message + ".", "hata");
      }
    });

    // =====================================================
    // YAKIT AYARLARI KARTI (Sürüm 1.4)
    // Kullanılan yakıtlar (en az biri) + km'nin girildiği ana yakıt.
    // Tek yakıt seçiliyse ana yakıt sorusu gizlenir (o yakıt kendiliğinden ana yakıttır).
    // =====================================================
    function ayarKartiGoster() {
      const ayar = ayarlariOku();
      YAKIT_KODLARI.forEach(kod => {
        el("ayar-" + kod).checked = ayar.yakitlar.includes(kod);
        const secili = ayar.yakitlar.includes(kod);
        el("ana-" + kod).hidden = !secili;
        el("ayar-ana").querySelector('label[for="ana-' + kod + '"]').hidden = !secili;
        el("ana-" + kod).checked = kod === ayar.anaYakit;
      });
      el("ana-yakit-blok").hidden = ayar.yakitlar.length < 2;
      const ana = yakitAdi(ayar.anaYakit);
      el("ayar-ipucu").textContent = ayar.yakitlar.length < 2
        ? "Gidilen km her " + ana + " dolumunda sorulur."
        : "Km sayacını " + ana + " aldığında sıfırla. Gidilen km sadece " + ana +
          " dolumunda sorulur; aradaki diğer yakıtla gidilen yol da bu km'ye dahildir.";
    }

    function ayarDegisti() {
      const yakitlar = YAKIT_KODLARI.filter(kod => el("ayar-" + kod).checked);
      if (!yakitlar.length) {   // hepsi kapatılamaz: son seçimi geri aç
        ayarKartiGoster();
        el("ayar-ipucu").textContent = "En az bir yakıt seçili olmalı.";
        return;
      }
      const isaretliAna = YAKIT_KODLARI.find(kod => el("ana-" + kod).checked);
      const anaYakit = yakitlar.includes(isaretliAna) ? isaretliAna : yakitlar[0];
      ayarlariYaz({ yakitlar, anaYakit });
      ayarKartiGoster();
      formuSifirla();          // kayıt formu yeni ayarlara göre
      ozetGuncelle();
      bildirimGoster("✓ Ayar kaydedildi");
    }
    el("ayar-yakitlar").addEventListener("change", ayarDegisti);
    el("ayar-ana").addEventListener("change", ayarDegisti);

    // Ekranın altında kısa süreli bildirim balonu
    const bildirim = document.createElement("div");
    bildirim.className = "bildirim";
    document.body.appendChild(bildirim);
    function bildirimGoster(mesaj) {
      bildirim.textContent = mesaj;
      bildirim.classList.add("goster");
      clearTimeout(bildirim.zamanlayici);
      bildirim.zamanlayici = setTimeout(() => bildirim.classList.remove("goster"), 1800);
    }

    // =====================================================
    // ÖZET SAYFASI (Adım 5 / Sürüm 0.6, 1.4'te Dizel ve yakıt ayarları, 1.5'te yıl görünümü,
    // önceki döneme göre karşılaştırma ve grafikler)
    // Km başı maliyet = dönemin tüm yakıt tutarı ÷ dönemin gidilen km toplamı.
    // Km sadece ana yakıt kayıtlarında girilir (aynı yol iki kez sayılmaz); toplam,
    // türe bakmadan km'si olan kayıtlardan alınır (ana yakıt sonradan değişse de eski aylar doğru kalır).
    // Dönem: ay görünümünde "2026-10", yıl görünümünde "2026". Kayıt tarihi bu yazıyla başlıyorsa
    // o döneme aittir (k.tarih.startsWith(donem)).
    // =====================================================
    function buAy() {
      const s = new Date();
      return s.getFullYear() + "-" + ikiHane(s.getMonth() + 1);
    }
    let gorunum = "ay";      // "ay" ya da "yil"
    let seciliAy = buAy();   // "2026-10" biçiminde (yıl görünümünde yılı buradan alınır)
    let grafikAy = null;     // grafikte ayrıntısı gösterilen ay ("2026-03"); null ise seçim yok
    let grafikDokunuldu = false;   // kullanıcı bir aya dokunduysa diğer aylar soluklaşır

    // "2026-10" → bir ay ileri/geri
    function ayKaydir(ay, fark) {
      const [y, a] = ay.split("-").map(Number);
      const t = new Date(y, a - 1 + fark, 1);
      return t.getFullYear() + "-" + ikiHane(t.getMonth() + 1);
    }
    const ayYazisi = ay => AY_ADLARI[+ay.slice(5, 7) - 1] + " " + ay.slice(0, 4);
    const kisaAy = ay => AY_ADLARI[+ay.slice(5, 7) - 1].slice(0, 3);
    const topla = (liste, alan) => liste.reduce((t, k) => t + (k[alan] || 0), 0);
    const kmTopla = liste => liste.reduce((t, k) => t + (gidilenKmBul(k) || 0), 0);

    // Seçili dönem ve karşılaştırılacak önceki dönem.
    // Yıl görünümünde bu yıl seçiliyse, geçen yılın AYNI DÖNEMİ (Ocak–bu ay) ile karşılaştırılır,
    // yoksa yarım yıl tam yılla kıyaslanıp hep "düşüş" görünürdü.
    function donemBilgisi() {
      if (gorunum === "ay") {
        const onceki = ayKaydir(seciliAy, -1);
        return {
          ad: ayYazisi(seciliAy),
          icinde: k => k.tarih.startsWith(seciliAy),
          oncekiIcinde: k => k.tarih.startsWith(onceki),
          karsilastirmaAdi: "Geçen aya göre" + (seciliAy === buAy() ? " (ay sürüyor)" : ""),
          oncekiAdi: "Geçen ay"
        };
      }
      const yil = seciliAy.slice(0, 4);
      const oncekiYil = String(+yil - 1);
      const buYilMi = yil === buAy().slice(0, 4);
      const sonAy = buAy().slice(5, 7);
      return {
        ad: yil,
        icinde: k => k.tarih.startsWith(yil),
        oncekiIcinde: k => k.tarih.startsWith(oncekiYil) && (!buYilMi || k.tarih.slice(5, 7) <= sonAy),
        karsilastirmaAdi: buYilMi ? "Geçen yılın aynı dönemine göre" : "Geçen yıla göre",
        oncekiAdi: buYilMi ? "Geçen yıl aynı dönem" : "Geçen yıl"
      };
    }

    // "Geçen aya göre ▲ %12 (+150,00 ₺)" yazısı. Önceki dönemde kayıt yoksa boş.
    function farkYazisi(simdi, onceki, d) {
      if (!(onceki > 0) || !(simdi > 0)) return "";
      const fark = simdi - onceki;
      const yuzde = Math.round(Math.abs(fark) / onceki * 100);
      if (yuzde === 0) return d.karsilastirmaAdi + ": <b>aynı</b>";
      return d.karsilastirmaAdi + ": <b>" + (fark > 0 ? "▲ %" : "▼ %") + yuzde + "</b> (" +
        (fark > 0 ? "+" : "−") + tlBicim.format(Math.abs(fark)) + " ₺)";
    }

    function ozetGuncelle() {
      const sirali = siraliKayitlar();
      const ayar = ayarlariOku();
      const d = donemBilgisi();
      const donemKayitlari = sirali.filter(d.icinde);
      const oncekiKayitlar = sirali.filter(d.oncekiIcinde);
      const bosYazi = gorunum === "ay" ? "Bu ayda kayıt yok" : "Bu yılda kayıt yok";

      // Dönem başlığı ve ok düğmeleri (ileri en fazla bugün, geri en eski kayda kadar)
      el("ay-adi").textContent = d.ad;
      const enEskiAy = sirali.length ? sirali[0].tarih.slice(0, 7) : buAy();
      if (gorunum === "ay") {
        el("ay-ileri").disabled = seciliAy >= buAy();
        el("ay-geri").disabled = seciliAy <= enEskiAy;
      } else {
        el("ay-ileri").disabled = seciliAy.slice(0, 4) >= buAy().slice(0, 4);
        el("ay-geri").disabled = seciliAy.slice(0, 4) <= enEskiAy.slice(0, 4);
      }

      // Bir yakıt türünün kartını doldurur
      function kartDoldur(liste, kod) {
        const tutar = topla(liste, "tutar");
        const litre = topla(liste, "litre");
        el("ozet-" + kod).textContent = liste.length ? tlBicim.format(tutar) + " ₺" : "— ₺";
        let alt = liste.length
          ? liste.length + " dolum · " + tlBicim.format(litre) + " L · ort. " + tlBicim.format(tutar / litre) + " ₺/L"
          : bosYazi;
        const tuketim = yuzKmTuketim(liste, kod);
        if (tuketim != null) alt += "\nOrtalama tüketim: " + tuketimBicim.format(tuketim) + " L/100 km";
        el("ozet-" + kod + "-alt").textContent = alt;
        const onceki = topla(oncekiKayitlar.filter(k => k.tur === kod), "tutar");
        el("ozet-" + kod + "-fark").innerHTML = farkYazisi(tutar, onceki, d);
      }
      // Her yakıtın kartı: ayarlarda seçiliyse ya da bu dönemde kaydı varsa görünür
      const donemYakitlari = [];   // bu dönemde kaydı olan yakıtlar (km kartındaki açıklama için)
      YAKIT_KODLARI.forEach(kod => {
        const liste = donemKayitlari.filter(k => k.tur === kod);
        if (liste.length) donemYakitlari.push(yakitAdi(kod));
        el("kart-" + kod).hidden = !ayar.yakitlar.includes(kod) && !liste.length;
        kartDoldur(liste, kod);
      });

      // Km başı maliyet
      const toplamTutar = topla(donemKayitlari, "tutar");
      const toplamKm = kmTopla(donemKayitlari);
      if (toplamKm > 0) {
        el("ozet-km").textContent = tlBicim.format(toplamTutar / toplamKm) + " ₺/km";
        el("ozet-km-alt").textContent = kmYazisi(toplamKm) + " km · toplam " +
          tlBicim.format(toplamTutar) + " ₺" +
          (donemYakitlari.length > 1 ? " (" + donemYakitlari.join(" + ") + ")" : "");
      } else {
        el("ozet-km").textContent = "— ₺/km";
        el("ozet-km-alt").textContent = donemKayitlari.length
          ? (gorunum === "ay" ? "Bu ay " : "Bu yıl ") + yakitAdi(ayar.anaYakit) + " kayıtlarında gidilen km girilmemiş."
          : bosYazi;
      }
      const oncekiKm = kmTopla(oncekiKayitlar);
      el("ozet-km-fark").innerHTML = toplamKm > 0 && oncekiKm > 0
        ? d.oncekiAdi + ": <b>" + tlBicim.format(topla(oncekiKayitlar, "tutar") / oncekiKm) + " ₺/km</b>"
        : "";

      // Yıl toplamı kartı (sadece yıl görünümünde)
      el("kart-yil").hidden = gorunum !== "yil";
      if (gorunum === "yil") {
        el("ozet-yil").textContent = donemKayitlari.length ? tlBicim.format(toplamTutar) + " ₺" : "— ₺";
        if (donemKayitlari.length) {
          const aylik = {};
          donemKayitlari.forEach(k => { const a = k.tarih.slice(0, 7); aylik[a] = (aylik[a] || 0) + k.tutar; });
          const aylar = Object.keys(aylik);
          const enPahali = aylar.reduce((m, a) => aylik[a] > aylik[m] ? a : m, aylar[0]);
          el("ozet-yil-alt").textContent =
            donemKayitlari.length + " dolum" + (toplamKm > 0 ? " · " + kmYazisi(toplamKm) + " km" : "") +
            " · aylık ort. " + tlBicim.format(toplamTutar / aylar.length) + " ₺\n" +
            "En pahalı ay: " + AY_ADLARI[+enPahali.slice(5, 7) - 1] + " (" + tlBicim.format(aylik[enPahali]) + " ₺)";
        } else {
          el("ozet-yil-alt").textContent = bosYazi;
        }
        el("ozet-yil-fark").innerHTML = farkYazisi(toplamTutar, topla(oncekiKayitlar, "tutar"), d);
      }

      grafikleriCiz(sirali);
    }

    // -----------------------------------------------------
    // GRAFİKLER (Sürüm 1.5) — kütüphanesiz, SVG ile çizilir (çevrimdışı da çalışır)
    // Aylık harcama: yakıt türüne göre üst üste çubuklar. Litre fiyatı: yakıt başına çizgi.
    // Renk yakıta bağlıdır (LPG hep mavi, Benzin turuncu, Dizel mor), sırası değişmez.
    // Bir aya dokununca iki grafikte de o ay seçilir ve altında rakamları yazar.
    // -----------------------------------------------------
    const SVG_NS = "http://www.w3.org/2000/svg";
    const GRAFIK_RENK = { LPG: "var(--g-lpg)", BENZIN: "var(--g-benzin)", DIZEL: "var(--g-dizel)" };
    const G_YUKSEKLIK = 180, G_SOL = 44, G_SAG = 8, G_UST = 10, G_ALT = 22;
    const kisaSayi = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 1 });   // eksen yazıları: "2,5 bin"

    // Grafikte gösterilecek 12 ay
    function grafikAylari() {
      if (gorunum === "yil") {
        const y = seciliAy.slice(0, 4);
        return Array.from({ length: 12 }, (_, i) => y + "-" + ikiHane(i + 1));
      }
      return Array.from({ length: 12 }, (_, i) => ayKaydir(seciliAy, i - 11));
    }

    // Eksen için "yuvarlak" adım: 0..ust aralığını yaklaşık 3 parçaya böler
    function guzelAdim(aralik) {
      const ham = aralik / 3;
      const us = Math.pow(10, Math.floor(Math.log10(ham)));
      const oran = ham / us;
      return (oran <= 1 ? 1 : oran <= 2 ? 2 : oran <= 2.5 ? 2.5 : oran <= 5 ? 5 : 10) * us;
    }

    function svgEleman(ad, ozellikler, ebeveyn) {
      const e = document.createElementNS(SVG_NS, ad);
      Object.entries(ozellikler).forEach(([k, v]) => e.setAttribute(k, v));
      if (ebeveyn) ebeveyn.appendChild(e);
      return e;
    }

    // Ortak iskelet: ızgara çizgileri, y ekseni yazıları, ay adları. Ölçek fonksiyonlarını döner.
    function grafikIskelet(svg, aylar, alt, ust, adim, yaziBicim) {
      svg.innerHTML = "";
      const G = Math.max(260, svg.clientWidth || svg.parentNode.clientWidth - 32 || 320);
      svg.setAttribute("viewBox", "0 0 " + G + " " + G_YUKSEKLIK);
      svg.setAttribute("height", G_YUKSEKLIK);
      const cizimG = G - G_SOL - G_SAG, cizimY = G_YUKSEKLIK - G_UST - G_ALT;
      const yOlcek = v => G_UST + cizimY - (v - alt) / (ust - alt) * cizimY;
      const dilim = cizimG / aylar.length;
      const xOrta = i => G_SOL + dilim * (i + 0.5);
      for (let v = alt; v <= ust + adim / 1000; v += adim) {
        svgEleman("line", { class: "izgara", x1: G_SOL, x2: G - G_SAG, y1: yOlcek(v), y2: yOlcek(v) }, svg);
        const t = svgEleman("text", { x: G_SOL - 6, y: yOlcek(v) + 4, "text-anchor": "end" }, svg);
        t.textContent = yaziBicim(v);
      }
      aylar.forEach((ay, i) => {
        // Dar ekranda her ay yazılamazsa birer atlayarak yaz (seçili ay her zaman yazılır)
        if (dilim < 24 && i % 2 === 1 && ay !== grafikAy) return;
        const t = svgEleman("text", { x: xOrta(i), y: G_YUKSEKLIK - 6, "text-anchor": "middle" }, svg);
        t.textContent = kisaAy(ay);
      });
      return { G, dilim, xOrta, yOlcek, cizimY };
    }

    function lejantYaz(kutuId, kodlar) {
      el(kutuId).innerHTML = kodlar.map(kod =>
        '<span><i style="background:' + GRAFIK_RENK[kod] + '"></i>' + yakitAdi(kod) + "</span>").join("");
    }

    function grafikleriCiz(sirali) {
      const aylar = grafikAylari();
      const ayVeri = aylar.map(ay => {
        const kayitlar = sirali.filter(k => k.tarih.startsWith(ay));
        const v = { ay, toplam: 0, tutar: {}, fiyat: {} };
        YAKIT_KODLARI.forEach(kod => {
          const liste = kayitlar.filter(k => k.tur === kod);
          const tutar = topla(liste, "tutar"), litre = topla(liste, "litre");
          v.tutar[kod] = tutar;
          v.fiyat[kod] = litre > 0 ? tutar / litre : null;
          v.toplam += tutar;
        });
        return v;
      });
      const kodlar = YAKIT_KODLARI.filter(kod => ayVeri.some(v => v.tutar[kod] > 0));
      const veriVar = kodlar.length > 0;
      el("kart-harcama-grafik").hidden = !veriVar;
      el("kart-fiyat-grafik").hidden = !veriVar;
      if (!veriVar) return;

      // Seçili ay grafik aralığında değilse: ay görünümünde seçili ay, yıl görünümünde seçim yok
      if (!aylar.includes(grafikAy)) grafikAy = gorunum === "ay" ? seciliAy : null;
      const secili = aylar.indexOf(grafikAy);
      el("harcama-grafik-baslik").textContent = gorunum === "ay" ? "Aylık harcama (son 12 ay)" : "Aylık harcama";
      lejantYaz("harcama-lejant", kodlar);
      lejantYaz("fiyat-lejant", kodlar);

      // --- Aylık harcama: üst üste çubuklar ---
      const svg1 = el("harcama-grafik");
      const enCok = Math.max(...ayVeri.map(v => v.toplam));
      const adim1 = guzelAdim(enCok);
      const o1 = grafikIskelet(svg1, aylar, 0, Math.ceil(enCok / adim1) * adim1, adim1,
        v => v >= 1000 ? kisaSayi.format(v / 1000) + " bin" : kisaSayi.format(v));
      const cubukG = Math.min(22, o1.dilim * 0.62);
      ayVeri.forEach((v, i) => {
        if (!(v.toplam > 0)) return;
        const grup = svgEleman("g", grafikDokunuldu && secili >= 0 && i !== secili ? { class: "soluk" } : {}, svg1);
        const x = o1.xOrta(i) - cubukG / 2;
        let taban = o1.yOlcek(0);
        const parcalar = kodlar.filter(kod => v.tutar[kod] > 0);
        parcalar.forEach((kod, j) => {
          // Parça yüksekliği; üstteki parçalardan 2px boşluk düşülür (parçalar ayrı görünsün)
          const h = Math.max(1, o1.yOlcek(0) - o1.yOlcek(v.tutar[kod]) - (j > 0 ? 2 : 0));
          const y = taban - h;
          const enUstte = j === parcalar.length - 1;
          const r = enUstte ? Math.min(4, h / 2, cubukG / 2) : 0;                // sadece en üst köşeler yuvarlak
          svgEleman("path", {
            d: "M" + x + "," + taban + "V" + (y + r) + "Q" + x + "," + y + " " + (x + r) + "," + y +
               "H" + (x + cubukG - r) + "Q" + (x + cubukG) + "," + y + " " + (x + cubukG) + "," + (y + r) +
               "V" + taban + "Z",
            fill: GRAFIK_RENK[kod]
          }, grup);
          taban = y - 2;
        });
      });
      el("harcama-detay").innerHTML = secili >= 0 ? harcamaDetayi(ayVeri[secili], kodlar) :
        "<small>Ayrıntı için bir aya dokun.</small>";

      // --- Litre fiyatı: yakıt başına çizgi (kaydı olmayan aylar atlanıp noktalar birleştirilir) ---
      const svg2 = el("fiyat-grafik");
      const fiyatlar = ayVeri.flatMap(v => kodlar.map(kod => v.fiyat[kod]).filter(f => f != null));
      let enAz = Math.min(...fiyatlar), enFazla = Math.max(...fiyatlar);
      if (enFazla - enAz < 1) { enAz -= 1; enFazla += 1; }
      const adim2 = guzelAdim(enFazla - enAz);
      const alt2 = Math.max(0, Math.floor(enAz / adim2) * adim2), ust2 = Math.ceil(enFazla / adim2) * adim2;
      const o2 = grafikIskelet(svg2, aylar, alt2, ust2, adim2, v => tlBicim.format(v).replace(/,00$/, ""));
      if (secili >= 0) {
        svgEleman("line", { class: "imlec", x1: o2.xOrta(secili), x2: o2.xOrta(secili), y1: G_UST, y2: o2.yOlcek(alt2) }, svg2);
      }
      kodlar.forEach(kod => {
        let yol = "";
        ayVeri.forEach((v, i) => {
          const f = v.fiyat[kod];
          if (f == null) return;
          yol += (yol ? "L" : "M") + o2.xOrta(i) + "," + o2.yOlcek(f);
        });
        svgEleman("path", { d: yol, fill: "none", stroke: GRAFIK_RENK[kod], "stroke-width": 2,
          "stroke-linejoin": "round", "stroke-linecap": "round" }, svg2);
        ayVeri.forEach((v, i) => {
          if (v.fiyat[kod] == null) return;
          // Seçili ayın noktası büyük ve zemin renginde halkalı, diğerleri küçük
          svgEleman("circle", i === secili
            ? { cx: o2.xOrta(i), cy: o2.yOlcek(v.fiyat[kod]), r: 5, fill: GRAFIK_RENK[kod], stroke: "var(--kart)", "stroke-width": 2 }
            : { cx: o2.xOrta(i), cy: o2.yOlcek(v.fiyat[kod]), r: 3, fill: GRAFIK_RENK[kod] }, svg2);
        });
      });
      el("fiyat-detay").innerHTML = secili >= 0 ? fiyatDetayi(ayVeri[secili], kodlar) :
        "<small>Ayrıntı için bir aya dokun.</small>";
    }

    function harcamaDetayi(v, kodlar) {
      if (!(v.toplam > 0)) return "<b>" + ayYazisi(v.ay) + "</b> · kayıt yok";
      const parcalar = kodlar.filter(kod => v.tutar[kod] > 0)
        .map(kod => yakitAdi(kod) + " " + tlBicim.format(v.tutar[kod]) + " ₺");
      return "<b>" + ayYazisi(v.ay) + "</b> · toplam " + tlBicim.format(v.toplam) + " ₺<br><small>" +
        parcalar.join(" · ") + "</small>";
    }
    function fiyatDetayi(v, kodlar) {
      const parcalar = kodlar.filter(kod => v.fiyat[kod] != null)
        .map(kod => yakitAdi(kod) + " " + tlBicim.format(v.fiyat[kod]) + " ₺/L");
      return "<b>" + ayYazisi(v.ay) + "</b>" + (parcalar.length ? "<br><small>" + parcalar.join(" · ") + "</small>" : " · kayıt yok");
    }

    // Grafiğe dokununca: dokunulan ayı bul (çubuktan büyük alan: ayın tüm dilimi)
    function grafikDokunma(olay) {
      const svg = olay.currentTarget;
      const kutu = svg.getBoundingClientRect();
      const G = svg.viewBox.baseVal.width || kutu.width;
      const x = (olay.clientX - kutu.left) / kutu.width * G;
      const dilim = (G - G_SOL - G_SAG) / 12;
      const i = Math.floor((x - G_SOL) / dilim);
      if (i < 0 || i > 11) return;
      const ay = grafikAylari()[i];
      // Aynı aya ikinci dokunuş seçimi kaldırır (ay görünümünde seçili aya döner)
      if (grafikAy === ay && grafikDokunuldu) {
        grafikDokunuldu = false;
        grafikAy = gorunum === "ay" ? seciliAy : null;
      } else {
        grafikDokunuldu = true;
        grafikAy = ay;
      }
      grafikleriCiz(siraliKayitlar());
    }
    el("harcama-grafik").addEventListener("click", grafikDokunma);
    el("fiyat-grafik").addEventListener("click", grafikDokunma);

    // Ekran döndürülünce / boyut değişince grafikler yeni genişliğe göre çizilsin
    let boyutZamanlayici = null;
    window.addEventListener("resize", () => {
      clearTimeout(boyutZamanlayici);
      boyutZamanlayici = setTimeout(() => { if (el("sayfa-ozet").classList.contains("aktif")) ozetGuncelle(); }, 150);
    });

    // Dönem okları: ay görünümünde bir ay, yıl görünümünde bir yıl kayar
    function donemKaydir(fark) {
      seciliAy = gorunum === "ay" ? ayKaydir(seciliAy, fark) : ayKaydir(seciliAy, fark * 12);
      // Yıl kayınca gelecek aya düşmesin
      if (seciliAy > buAy()) seciliAy = buAy();
      grafikAy = null;
      grafikDokunuldu = false;
      ozetGuncelle();
    }
    el("ay-geri").addEventListener("click", () => donemKaydir(-1));
    el("ay-ileri").addEventListener("click", () => donemKaydir(+1));
    el("gorunum-secim").addEventListener("change", () => {
      gorunum = el("gorunum-yil").checked ? "yil" : "ay";
      grafikAy = null;
      grafikDokunuldu = false;
      ozetGuncelle();
    });

    // =====================================================
    // FİŞ OKUMA (Adım 6 / Sürüm 0.7)
    // Tesseract.js telefonda çalışır (sunucu yok). İlk kullanımda okuma aracı
    // ve Türkçe dil dosyası internetten iner, sonra telefonda saklanır.
    // Akış: fotoğraf → görüntü iyileştirme → okuma → metinden değerleri ayıklama
    //       → değerler tutarsızsa ikinci ayarla bir kez daha okuma → forma doldurma
    // =====================================================
    const TESSERACT_ADRESI = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    const DIL_DOSYASI_ADRESI = "https://cdn.jsdelivr.net/npm/@tesseract.js-data/tur@1.0.0/4.0.0_best_int";
    let ocrIsci = null;        // okuma motoru (bir kez hazırlanır, sonra tekrar kullanılır)
    let ocrAsama = "";         // ilerleme yazısı için

    function fisDurum(mesaj, tur) {
      const d = el("fis-durum");
      d.textContent = mesaj;
      d.className = "fis-durum" + (tur ? " " + tur : "");
    }

    // Dış betiği bir kez yükler
    function betikYukle(adres) {
      return new Promise((tamam, hata) => {
        if (window.Tesseract) return tamam();
        const b = document.createElement("script");
        b.src = adres;
        b.onload = () => tamam();
        b.onerror = () => hata(new Error("betik yüklenemedi"));
        document.head.appendChild(b);
      });
    }

    async function ocrHazirla() {
      if (ocrIsci) return ocrIsci;
      fisDurum("Okuma aracı hazırlanıyor… (ilk seferde biraz sürer)");
      await betikYukle(TESSERACT_ADRESI);
      ocrIsci = await Tesseract.createWorker("tur", 1, {
        langPath: DIL_DOSYASI_ADRESI,
        logger: m => {
          if (typeof m.progress !== "number") return;
          const yuzde = Math.round(m.progress * 100);
          if (m.status === "recognizing text") fisDurum(ocrAsama + " %" + yuzde);
          else if (/load/.test(m.status)) fisDurum("Okuma aracı hazırlanıyor… %" + yuzde);
        }
      });
      // Fiş tek blok metin gibi okunsun
      await ocrIsci.setParameters({ tessedit_pageseg_mode: "6" });
      return ocrIsci;
    }

    // Seçilen dosyayı resim olarak açar (iPhone fotoğrafın yönünü kendisi düzeltir)
    function resimAc(dosya) {
      return new Promise((tamam, hata) => {
        const resim = new Image();
        const adres = URL.createObjectURL(dosya);
        resim.onload = () => { URL.revokeObjectURL(adres); tamam(resim); };
        resim.onerror = () => { URL.revokeObjectURL(adres); hata(new Error("resim açılamadı")); };
        resim.src = adres;
      });
    }

    // Görüntü iyileştirme: küçült/büyüt, griye çevir, gölgeyi temizle (arka plan bölme),
    // isteğe bağlı siyah-beyaz eşik. bulaniklik: arka plan tahmini için ölçek, esik: 0-255 ya da null
    function fisGoruntusu(resim, bulaniklik, esik) {
      const olcek = Math.min(2, 1600 / Math.max(resim.naturalWidth || resim.width, resim.naturalHeight || resim.height));
      const G = Math.round((resim.naturalWidth || resim.width) * olcek);
      const Y = Math.round((resim.naturalHeight || resim.height) * olcek);

      const tuval = document.createElement("canvas");
      tuval.width = G; tuval.height = Y;
      const c = tuval.getContext("2d", { willReadFrequently: true });
      c.drawImage(resim, 0, 0, G, Y);
      const veri = c.getImageData(0, 0, G, Y);

      // Arka planı tahmin et: resmi çok küçültüp geri büyüt (ucuz bulanıklaştırma)
      const kucuk = document.createElement("canvas");
      kucuk.width = Math.max(1, Math.round(G / bulaniklik));
      kucuk.height = Math.max(1, Math.round(Y / bulaniklik));
      const kc = kucuk.getContext("2d");
      kc.imageSmoothingEnabled = true; kc.imageSmoothingQuality = "high";
      kc.drawImage(tuval, 0, 0, kucuk.width, kucuk.height);
      const arka = document.createElement("canvas");
      arka.width = G; arka.height = Y;
      const ac = arka.getContext("2d", { willReadFrequently: true });
      ac.imageSmoothingEnabled = true; ac.imageSmoothingQuality = "high";
      ac.drawImage(kucuk, 0, 0, G, Y);
      const arkaVeri = ac.getImageData(0, 0, G, Y).data;

      const p = veri.data;
      for (let i = 0; i < p.length; i += 4) {
        const gri = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2];
        const zemin = 0.299 * arkaVeri[i] + 0.587 * arkaVeri[i + 1] + 0.114 * arkaVeri[i + 2];
        let n = Math.min(255, gri / (zemin + 1) * 255);
        if (esik != null) n = n < esik ? 0 : 255;
        p[i] = p[i + 1] = p[i + 2] = n;
      }
      c.putImageData(veri, 0, 0);
      return tuval;
    }

    // --- Metinden değer ayıklama -------------------------------------------
    // Okuma hatalarında rakam yerine çıkan harfleri düzelt (@ → 0 gibi)
    function rakamDuzelt(t) {
      return t.replace(/[@OoQD]/g, "0").replace(/[Il|]/g, "1");
    }
    // "1.154,00" / "1,184,00" / "28,450" → sayı (son ayırıcı ondalık kabul edilir)
    function fisSayisi(t) {
      const s = rakamDuzelt(t).replace(/\s/g, "");
      const parca = s.split(/[.,]/);
      if (parca.length < 2) return NaN;
      const ondalik = parca.pop();
      return parseFloat(parca.join("") + "." + ondalik);
    }
    // En çok tekrar eden değer (eşitlikte ilk görülen)
    function enCokTekrar(liste) {
      const say = new Map();
      liste.forEach(x => say.set(x, (say.get(x) || 0) + 1));
      let enIyi = null, enCok = 0;
      say.forEach((n, x) => { if (n > enCok) { enCok = n; enIyi = x; } });
      return enIyi;
    }

    const R = "[0-9@OoQD]";   // rakam ya da rakama benzeyen harf
    const TUTAR_DESENI = new RegExp("\\*\\s*\\+?\\s*(" + R + "{1,3}(?:\\s*[.,]{1,2}\\s*" + R + "{3})*\\s*[.,]{1,2}\\s*" + R + "{2})", "g");
    // "28,450 LT X 40,56": aradaki birim ("LT") çoğu zaman bozuk okunur ("VE", "LL"...),
    // bu yüzden iki sayı arasında 0-3 harf ve "X" yeterli sayılır
    const LITRE_DESENI = new RegExp("(" + R + "{1,3}\\s*[.,]\\s*" + R + "{2,3})\\s*[A-Za-zÇĞİÖŞÜçğıöşü|]{0,3}\\s*[Xx×*]\\s*(" + R + "{1,3}\\s*[.,]\\s*" + R + "{2})", "g");

    // metinler: bir ya da daha fazla okuma sonucunun metni
    function fisCozumle(metinler) {
      const sonuc = { tarih: null, saat: null, litre: null, fiyat: null, tutar: null, tur: null, emin: false };
      const tutarlar = [], litreler = [], fiyatlar = [];
      const gunler = [], aylar = [], yillar = [], saatler = [];
      const buYil = new Date().getFullYear();

      metinler.forEach(metin => {
        const satirlar = metin.split(/\r?\n/);
        satirlar.forEach(satir => {
          // Tutarlar: "*" ile başlayan para değerleri (KDV satırı hariç). TOPLAM satırı üç oy.
          if (!/KDV|TOPK/i.test(satir)) {
            for (const m of satir.matchAll(TUTAR_DESENI)) {
              const v = fisSayisi(m[1]);
              if (v >= 10 && v <= 50000) {
                tutarlar.push(Math.round(v * 100) / 100);
                // TOPLAM satırı büyük ve kalın puntolu, en net okunan satır: toplam 3 oy
                if (/TOPLAM/i.test(satir)) tutarlar.push(Math.round(v * 100) / 100, Math.round(v * 100) / 100);
              }
            }
          }
          // "28,450 LT X 40,56" → litre ve litre fiyatı
          for (const m of satir.matchAll(LITRE_DESENI)) {
            const l = fisSayisi(m[1]), f = fisSayisi(m[2]);
            if (l > 0.5 && l < 200) litreler.push(l);
            if (f > 5 && f < 200) fiyatlar.push(f);
          }
          // Tarih (gün-ay-yıl): her parça ayrı doğrulanır, geçersiz olanlar atılır
          const duz = rakamDuzelt(satir);
          const t = duz.match(/(?<!\d)(\d{1,2})\s*[-.\/ ]\s*(\d{1,2})\s*[-.\/ ]\s*(\d{4})(?!\d)/);
          if (t) {
            const g = +t[1], a = +t[2], y = +t[3];
            if (g >= 1 && g <= 31) gunler.push(g);
            if (a >= 1 && a <= 12) aylar.push(a);
            if (y >= buYil - 1 && y <= buYil) yillar.push(y);
          }
          // Saat (SS:DD), tarih satırındakiler önce gelir
          for (const s of duz.matchAll(/(\d{1,2})\s*:\s*(\d{2})(?!\d)/g)) {
            const ss = +s[1], dd = +s[2];
            if (ss <= 23 && dd <= 59) {
              const deger = ikiHane(ss) + ":" + ikiHane(dd);
              saatler.push(deger);
              if (t) saatler.push(deger);
            }
          }
        });

        // Yakıt türü (lisans satırındaki "LPG-BAY" sayılmaz)
        const buyuk = metin.toLocaleUpperCase("tr");
        if (!sonuc.tur) {
          if (/0T0\s*GAZ|OTO\s*GAZ|OTOGAZ/.test(rakamDuzelt(buyuk).replace(/0/g, "O")) ||
              /\bLPG\b(?!\s*-?\s*BAY)/.test(buyuk)) sonuc.tur = "LPG";
          // Dizel benzinden önce bakılır: bazı dizel ürün adlarında benzin desenindeki kelimeler de geçer (Sürüm 1.4)
          else if (/MOTOR[İI1]N|D[İI1]ZEL|D[İI1]ESEL/.test(buyuk)) sonuc.tur = "DIZEL";
          else if (/BENZ[İI]N|KUR[ŞS]UNSUZ|V\s*\/?\s*MAX|EXCELL|ULTIMATE/.test(buyuk)) sonuc.tur = "BENZIN";
        }

      });

      // Tarih
      const g = enCokTekrar(gunler), a = enCokTekrar(aylar), y = enCokTekrar(yillar);
      if (g && a && y) {
        const tarih = y + "-" + ikiHane(a) + "-" + ikiHane(g);
        const yarin = new Date(); yarin.setDate(yarin.getDate() + 1);
        if (new Date(tarih) <= yarin) sonuc.tarih = tarih;
      }
      sonuc.saat = enCokTekrar(saatler);

      // Tutar: en çok tekrar eden. Litre × fiyat ile çapraz kontrol.
      const T = enCokTekrar(tutarlar);
      let enIyi = null;
      litreler.forEach(l => fiyatlar.forEach(f => {
        const hedef = T || l * f;
        const hata = Math.abs(l * f - hedef) / hedef;
        if (!enIyi || hata < enIyi.hata) enIyi = { l, f, hata };
      }));

      if (T) {
        sonuc.tutar = T;
        if (enIyi && enIyi.hata <= 0.006) {
          // Tutarlı: fiyat güvenilir, litre tutar ÷ fiyat'tan (okuma hatalarını düzeltir)
          sonuc.fiyat = enIyi.f;
          sonuc.litre = Math.round(T / enIyi.f * 1000) / 1000;
          sonuc.emin = true;
        } else if (fiyatlar.length) {
          // Tutarsız: makul litre veren fiyatı al, kullanıcı kontrol etsin
          const f = fiyatlar.find(f => T / f > 1 && T / f < 150);
          if (f) { sonuc.fiyat = f; sonuc.litre = Math.round(T / f * 1000) / 1000; }
        }
      } else if (enIyi) {
        sonuc.litre = enIyi.l;
        sonuc.fiyat = enIyi.f;
        sonuc.tutar = Math.round(enIyi.l * enIyi.f * 100) / 100;
      }
      return sonuc;
    }

    // Okunan değerleri forma yazar ve neyin okunup neyin okunamadığını söyler
    function fisiFormaYaz(s) {
      const doldurulan = [];
      const isaretle = id => {
        el(id).classList.add("okundu");
        setTimeout(() => el(id).classList.remove("okundu"), 2500);
      };
      if (s.tur) turSec(s.tur);   // ayarlarda seçili olmayan bir yakıtsa da görünür olur
      if (s.tarih) { el("f-tarih").value = s.tarih; isaretle("f-tarih"); doldurulan.push("tarih"); }
      if (s.saat)  { el("f-saat").value = s.saat;   isaretle("f-saat");  doldurulan.push("saat"); }
      if (s.tutar) {
        ucluDoldur(s.litre, s.tutar, s.fiyat);
        UCLU.forEach(id => { if (el(id).value) isaretle(id); });
        if (s.litre) doldurulan.push("litre");
        doldurulan.push("tutar");
      }
      kmIpucuGoster();

      const eksik = ["tarih", "saat", "litre", "tutar"].filter(x => !doldurulan.includes(x));
      if (!doldurulan.length) {
        fisDurum("Fişten bir şey okunamadı. Fişi düz bir zeminde, yakından ve gölgesiz çekmeyi dene.", "hata");
      } else if (eksik.length || !s.emin) {
        fisDurum("Okundu: " + doldurulan.join(", ") +
          (eksik.length ? ". Okunamadı: " + eksik.join(", ") : "") +
          ". Değerleri fişle karşılaştır.", "uyari");
      } else {
        fisDurum("✓ Okundu: " + doldurulan.join(", ") + (kmZorunlu() ? ". Kilometreyi girip kaydet." : ". Kontrol edip kaydet."));
      }
    }

    el("fis-dugmesi").addEventListener("click", () => el("fis-dosya").click());

    el("fis-dosya").addEventListener("change", async () => {
      const dosya = el("fis-dosya").files[0];
      el("fis-dosya").value = "";            // aynı fotoğraf tekrar seçilebilsin
      if (!dosya) return;
      const dugme = el("fis-dugmesi");
      dugme.disabled = true;
      try {
        const resim = await resimAc(dosya);
        const isci = await ocrHazirla();

        // Görüntü ayarları sırayla denenir; değerler tutarlı ve tam çıkınca durulur.
        // (bulanıklık, eşik): 1) gri tonlu  2) siyah-beyaz  3) kaba siyah-beyaz
        // Gerçek fişlerle test edildi: üçü birlikte her fişte tüm alanları doğru verdi.
        const AYARLAR = [[15, null, "Fiş okunuyor…"],
                         [30, 200, "Daha dikkatli okunuyor…"],
                         [50, 190, "Son bir kez deneniyor…"]];
        const metinler = [];
        let sonuc = null;
        for (const [bulaniklik, esik, yazi] of AYARLAR) {
          ocrAsama = yazi;
          metinler.push((await isci.recognize(fisGoruntusu(resim, bulaniklik, esik))).data.text);
          sonuc = fisCozumle(metinler);
          if (sonuc.emin && sonuc.tarih && sonuc.saat) break;
        }
        fisiFormaYaz(sonuc);
      } catch (e) {
        console.error(e);
        fisDurum(e.message === "betik yüklenemedi"
          ? "Okuma aracı indirilemedi. İnternet bağlantını kontrol edip tekrar dene."
          : "Fiş okunamadı. Tekrar dene ya da değerleri elle gir.", "hata");
      } finally {
        dugme.disabled = false;
      }
    });

    // Uygulama açılınca
    sayacKayitlariniCevir();
    ayarKartiGoster();
    formuSifirla();
    hepsiniGuncelle();

    // Çevrimdışı çalışma (Adım 8 / Sürüm 1.0): sw.js uygulamayı telefonda saklar
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      navigator.serviceWorker.register("sw.js").catch(e => console.error("Çevrimdışı mod açılamadı:", e));
    }
  </script>
</body>
